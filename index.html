<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Школа 2030: игра по видео Билла Гейтса</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#2f6fed;--ok:#1e9e5a;--bad:#d64545;--bd:#e3ded2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mut:#9aa3b2;--ac:#6c9bff;--ok:#43c283;--bad:#ef6b6b;--bd:#2e3442}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mut:#9aa3b2;--ac:#6c9bff;--ok:#43c283;--bad:#ef6b6b;--bd:#2e3442}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.bar{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}
.track{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:16px}
.fill{height:100%;width:0;background:var(--ac);transition:width .4s}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.fb{margin:6px 0 14px;color:var(--mut);min-height:1.4em}
.btn{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}
.big{font-size:3rem;margin:0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎓 Школа 2030</h1>
  <p class="sub">Игра по видео Билла Гейтса «Как онлайн-курсы могут радикально улучшить образование к 2030 году»</p>

  <div id="start" class="card">
    <p class="big">🌍</p>
    <p>Ты — министр образования будущего. Отвечай на вопросы по видео и открывай школы по всему миру. У тебя 3 жизни ❤️. Каждый верный ответ добавляет очки и новую школу.</p>
    <button class="btn" id="go">Начать игру</button>
  </div>

  <div id="game" class="card hide">
    <div class="bar"><span id="lives"></span><span id="score"></span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <p class="q" id="q"></p>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hide" id="next">Дальше →</button>
  </div>

  <div id="end" class="card hide">
    <p class="big" id="emoji"></p>
    <h2 id="title" style="margin:0 0 8px"></h2>
    <p id="res"></p>
    <button class="btn" id="again">Играть ещё раз</button>
  </div>
</div>

<script>
var Q=[
{q:"На что в США направляется больше финансирования, чем на любые другие цели?",a:["Образование","Космос","Спорт","Транспорт"],c:0,e:"Верно: образование получает больше всего финансирования."},
{q:"Что, по видео, становится стандартом в образовании будущего?",a:["Только лекции в аудиториях","Интерактивные курсы и поддержка тренеров","Обучение без преподавателей","Только бумажные учебники"],c:1,e:"Интерактивные курсы плюс поддержка тренеров."},
{q:"Насколько у женщин в Африке меньше шансов иметь мобильный телефон, чем у мужчин?",a:["На 5%","На 12%","На 24%","На 50%"],c:2,e:"В Африке разрыв составляет 24%."},
{q:"А насколько меньше шансов у женщин в Азии?",a:["На 37%","На 10%","На 24%","На 70%"],c:0,e:"В Азии разрыв ещё больше: 37%."},
{q:"Что такое «волновой эффект» образования женщин?",a:["Они чаще переезжают в другие страны","Они зарабатывают больше, а их дети чаще выживают и учатся","Они быстрее заканчивают школу","Они меньше пользуются интернетом"],c:1,e:"Образование женщин улучшает жизнь и следующего поколения."},
{q:"Что нужно, чтобы онлайн-образование открыло новые возможности для девочек?",a:["Только дорогой компьютер","Только государственная программа","Мотивация","Ничего, всё происходит само"],c:2,e:"Возможности есть при наличии мотивации."},
{q:"В каких областях в США среди студентов больше женщин?",a:["Бизнес и медицина","Физика и математика","Инженерия и программирование","Нигде"],c:0,e:"Это бизнес и медицина."},
{q:"Где гендерное неравенство всё ещё остаётся?",a:["В начальной школе","В сложных науках и при получении докторской степени","В медицине","В бизнесе"],c:1,e:"Это сложные науки и докторская степень."},
{q:"Что делают технологии со стоимостью образования?",a:["Повышают","Не влияют","Снижают, и больше людей управляют своим будущим","Делают её непредсказуемой"],c:2,e:"Технологии снижают стоимость и расширяют доступ."}
];
var st,order,i,lives,score,locked;
function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function show(id){["start","game","end"].forEach(function(x){$(x).classList.toggle("hide",x!==id)})}
function hud(){$("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);$("score").textContent="Очки: "+score+" · Школ: "+(score/10)}
function start(){lives=3;score=0;i=0;order=shuffle(Q.map(function(_,k){return k}));show("game");render()}
function render(){
  locked=false;var o=Q[order[i]];hud();
  $("fill").style.width=(i/Q.length*100)+"%";
  $("q").textContent=(i+1)+"/"+Q.length+". "+o.q;
  $("fb").textContent="";$("next").classList.add("hide");
  var box=$("opts");box.innerHTML="";
  shuffle(o.a.map(function(t,k){return{t:t,k:k}})).forEach(function(x){
    var b=document.createElement("button");b.className="opt";b.textContent=x.t;
    b.onclick=function(){pick(b,x.k===o.c,o)};box.appendChild(b)});
}
function pick(b,ok,o){
  if(locked)return;locked=true;
  var all=$("opts").children;
  for(var k=0;k<all.length;k++){all[k].disabled=true;if(all[k].textContent===o.a[o.c])all[k].classList.add("ok")}
  if(ok){score+=10;$("fb").textContent="✅ "+o.e}
  else{lives--;b.classList.add("bad");$("fb").textContent="❌ "+o.e}
  hud();$("fill").style.width=((i+1)/Q.length*100)+"%";
  $("next").textContent=(lives===0||i===Q.length-1)?"Результат →":"Дальше →";
  $("next").classList.remove("hide");
}
function next(){
  if(lives===0||i===Q.length-1){finish();return}
  i++;render();
}
function finish(){
  show("end");var win=lives>0,sch=score/10;
  var rank=sch>=9?"Министр года 🏆":sch>=6?"Реформатор образования":sch>=3?"Начинающий директор":"Стажёр в министерстве";
  $("emoji").textContent=win?(sch===9?"🏆":"🏫"):"📚";
  $("title").textContent=win?"Образование 2030 построено!":"Жизни закончились";
  $("res").textContent="Открыто школ: "+sch+" из "+Q.length+". Очки: "+score+". Звание: "+rank+"."+(win?"":" Попробуй ещё раз и пересмотри видео.");
}
$("go").onclick=start;$("next").onclick=next;$("again").onclick=start;
</script>
</body>
</html>
